<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Night</title>
<style>
  :root { --panel:#121831; --edge:#ecdcb4; --ink:#f3ead6; --dim:#9aa3b8; --warm:#ffcf6b; }
  html, body { margin:0; height:100%; background:#07090f; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:1152px; height:648px; transform-origin:center; flex:none; }
  #game canvas { display:block; image-rendering:pixelated; }
  .ui { position:absolute; inset:0; pointer-events:none; color:var(--ink); }
  .panel { background:var(--panel); border:3px solid var(--edge); box-shadow:0 0 0 3px #000, inset 0 0 0 2px #1d2547; }
  #chip { position:absolute; top:16px; left:16px; padding:8px 14px; font:16px 'Silkscreen', monospace; letter-spacing:1.5px; }
  #chip b { color:var(--warm); font-weight:normal; }
  #build { position:absolute; top:16px; right:16px; padding:5px 9px; background:#000b; font:11px 'Silkscreen', monospace; color:var(--dim); letter-spacing:1px; }
  #hint { display:none; position:absolute; right:22px; bottom:22px; padding:6px 12px; font:14px 'Silkscreen', monospace; }
  #hint b { color:var(--warm); font-weight:normal; }
  #dialog { display:none; position:absolute; left:24px; right:24px; bottom:18px; padding:16px 24px 12px; min-height:92px; box-sizing:border-box; }
  #dialog-body { max-width:820px; font:21px/1.5 'Pixelify Sans', monospace; letter-spacing:.3px; text-wrap:pretty; }
  #dialog-name { color:var(--warm); margin-right:10px; font-family:'Silkscreen', monospace; font-size:17px; letter-spacing:1px; }
  #dialog-foot { display:flex; justify-content:space-between; margin-top:8px; font:12px 'Silkscreen', monospace; color:var(--dim); letter-spacing:1px; }
  #dialog-foot .keys b { color:var(--ink); font-weight:normal; }
  #toast { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font:34px 'Pixelify Sans', monospace; color:var(--ink);
           text-shadow:0 3px 0 #000, 0 0 24px #000; opacity:0; transition:opacity .5s; white-space:nowrap; }
  #toast.show { opacity:1; }
  #debug { display:none; position:absolute; left:16px; top:64px; padding:10px 12px; font:12px 'Silkscreen', monospace; pointer-events:auto; color:var(--ink); }
  #debug button, #debug select { font:11px 'Silkscreen', monospace; margin:2px; background:#1d2547; color:var(--ink); border:1px solid var(--edge); padding:3px 6px; cursor:pointer; }
  #debug .row { margin:4px 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="game"></div>
  <div class="ui">
    <div id="chip" class="panel"></div>
    <div id="build">M1 build · no interventions yet · [`] debug</div>
    <div id="toast"></div>
    <div id="hint" class="panel"></div>
    <div id="dialog" class="panel"><div id="dialog-body"><span id="dialog-name"></span><span id="dialog-text"></span></div><div id="dialog-foot"></div></div>
    <div id="debug" class="panel"></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
