<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Night — Style Frame</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --panel:#141a2e; --edge:#e8dcc0; --ink:#f3ead6; --dim:#9aa3b8; --warm:#ffcf6b; }
  html,body { margin:0; background:#0b0e18; }
  .frame { position:relative; width:1152px; height:672px; }
  canvas { display:block; image-rendering:pixelated; }
  .ui { position:absolute; inset:0; font-family:'Silkscreen', monospace; color:var(--ink); pointer-events:none; }
  .chip { position:absolute; top:14px; left:14px; background:var(--panel); border:3px solid var(--edge);
          box-shadow:0 0 0 3px #000; padding:6px 12px; font-size:16px; letter-spacing:1px; }
  .chip b { color:var(--warm); font-weight:normal; }
  .box { position:absolute; left:24px; right:24px; bottom:18px; background:var(--panel);
         border:3px solid var(--edge); box-shadow:0 0 0 3px #000; padding:12px 16px; font-size:16px; line-height:1.55; }
  .who { color:var(--warm); }
  .prompt { color:var(--ink); }
  .prompt::before { content:'> '; color:var(--warm); }
  .parse { color:var(--dim); font-size:13px; }
  .label { position:absolute; top:14px; right:14px; background:#000a; padding:4px 8px; font-size:11px; color:var(--dim); }
</style>
</head>
<body>
<div class="frame">
  <canvas id="c" width="1152" height="672"></canvas>
  <div class="ui" id="ui"></div>
</div>
<script>
// Static style frame — NOT game code. Low-res scene (384x224) drawn per pixel, upscaled 3x nearest-neighbour.
const W = 384, H = 224, S = 3;
const mode = new URLSearchParams(location.search).get('frame') || '1984';
const NIGHT = mode === '1984';
const lo = document.createElement('canvas'); lo.width = W; lo.height = H;
const g = lo.getContext('2d');

function hex(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function mix(a,b,t){ return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }
function col(h){ // timeline grading
  let c = hex(h);
  if (NIGHT) c = mix(c, [22,30,62], 0.58);
  else { const l=(c[0]+c[1]+c[2])/3; c = mix(c,[l,l+3,l+8],0.28); c = mix(c,[150,158,165],0.12); }
  return `rgb(${c})`;
}
const raw = h => h;
function R(x,y,w,h,c,graded=true){ g.fillStyle = graded?col(c):c; g.fillRect(x,y,w,h); }
const hash = (x,y)=>{ let n=x*374761393+y*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; };

// ---- tiny 3x5 bitmap font for in-world signs ----
const F = {A:".#.#.#####.##.#",B:"##.#.###.#.###.",C:".###..#..#...##",D:"##.#.##.##.###.",E:"####..##.#..###",F:"####..##.#..#..",
G:".###..#.##.#.##",H:"#.##.#####.##.#",I:"###.#..#..#.###",K:"#.##.###.#.##.#",L:"#..#..#..#..###",M:"#.########.##.#",
N:"##.#.##.##.##.#",O:".#.#.##.##.#.#.",P:"##.#.###.#..#..",R:"##.#.###.#.##.#",S:".###...#...###.",T:"###.#..#..#..#.",
U:"#.##.##.##.####",V:"#.##.##.##.#.#.",W:"#.##.########.#",Y:"#.##.#.#..#..#.",
"0":"####.##.##.####","1":".#.##..#..#.###","4":"#.##.####..#..#","8":"####.#####.####","9":"####.####..###.",".":"............#..","-":"......###......"," ":"..............."};
function txt(s,x,y,c,graded=true){ for(const ch of s){ const gl=(F[ch]||F[' ']).padEnd(15,'.');
  for(let i=0;i<15;i++) if(gl[i]==='#') R(x+i%3,y+(i/3|0),1,1,c,graded); x+=4; } }

// ---- terrain ----
function cobbles(x0,y0,w,h){
  R(x0,y0,w,h,'#8b8579');
  for(let y=y0;y<y0+h;y+=4) for(let x=x0+((y/4)%2?2:0);x<x0+w;x+=5){
    const r=hash(x,y); R(x,y,4,3, r<.33?'#958f82':r<.66?'#817b70':'#8f897c'); R(x,y+3,4,1,'#6c675e');
  }
}
function water(y0){
  R(0,y0,W,H-y0,'#2f6f82');
  for(let y=y0;y<H;y++) for(let x=0;x<W;x++){
    const v=Math.sin(x*0.21+y*1.7)+Math.sin(x*0.05-y*0.6);
    if(v>1.55) R(x,y,1,1,'#6fb0bd'); else if(v<-1.5) R(x,y,1,1,'#275d6e');
  }
}
function quayEdge(y,x0=0,x1=W){ R(x0,y,x1-x0,2,'#b1a998'); R(x0,y+2,x1-x0,7,'#6f695f');
  for(let x=x0;x<x1;x+=12) R(x,y+2,1,7,'#4f4a43'); R(x0,y+9,x1-x0,1,'#3a3d40'); }

// ---- buildings ----
function building(x,y,w,h,roofH,o){
  R(x,y,w,roofH,o.roof); for(let ry=y+3;ry<y+roofH;ry+=4) R(x,ry,w,1,o.roofLine);
  R(x,y+roofH-2,w,2,o.eave||'#3b2a22');
  R(x,y+roofH,w,h-roofH,o.wall); R(x,y+h-2,w,2,o.base||'#5a554d');
  for(const [wx,wy] of o.windows||[]) win(x+wx,y+roofH+wy,o.lit);
  if(o.door) door(x+o.door,y+h-16,o.boarded);
}
function win(x,y,lit){ R(x-1,y-1,10,12,'#4a3a2e'); if(lit && NIGHT){ R(x,y,8,10,'#ffcf6b',false); R(x,y+5,8,1,'#c9873a',false); R(x+4,y,1,10,'#c9873a',false);} else { R(x,y,8,10,'#33424f'); R(x,y,3,3,'#5d7383'); R(x+4,y,1,10,'#4a3a2e'); } }
function door(x,y,boarded){ R(x,y,12,16,'#5a3a26'); R(x+1,y+1,10,15,'#6e4830'); R(x+9,y+8,1,1,'#d8b26a');
  if(boarded){ R(x-2,y+3,16,3,'#a07850'); R(x-2,y+9,16,3,'#93704a'); } }
function boardUp(x,y){ R(x-2,y+2,12,2,'#a07850'); R(x-2,y+6,12,2,'#93704a'); }

// ---- people: 10x16 template ----
const P = [
"...OOOO...","..OHHHHO..",".OHHHHHHO.",".OHSSSSHO.",".OSESSESO.",".OSSSSSSO.","..OSSSSO..",".OCCCCCCO.",
"OCCCACCCCO","OSCCACCCSO","OSCCACCCSO",".OCCCCCCO.",".OPPPPPPO.",".OPPOOPPO.",".OBBOOBBO.","..OO..OO.."];
function person(x,y,c,{kid=false,old=false,prop=null}={}){
  let rows = P.slice(); if(kid) rows.splice(9,2);
  const pal={O:'#1c1a22',H:c.hair,S:c.skin,E:'#1c1a22',C:c.coat,A:c.accent,P:c.pants,B:'#2a2420'};
  const oy = y + (kid?2:0) + (old?1:0);
  R(x+1,oy+rows.length-1,9,2,'#00000055',false); // shadow
  rows.forEach((r,j)=>{ for(let i=0;i<10;i++){ const k=r[i]; if(k!=='.') R(x+i+(old&&j<7?1:0),oy+j,1,1,pal[k]); } });
  if(prop==='broom'){ R(x+11,oy+2,1,12,'#a07850'); R(x+9,oy+13,5,3,'#d8b26a'); }
  if(prop==='wrench'){ R(x+10,oy+9,4,1,'#c0c4c8'); R(x+13,oy+8,1,3,'#c0c4c8'); }
  if(prop==='cane'){ R(x+11,oy+7,1,9,'#5a3a26'); }
}

// ---- scene pieces ----
function clockTower(stopped){
  building(136,0,32,66,10,{roof:'#4c5a6e',roofLine:'#3d4a5c',wall:'#cbbd9f',door:10});
  R(144,14,16,16,'#e9e0c8'); R(145,15,14,14,'#f6efdc'); R(152,16,1,7,'#1c1a22'); R(152,22,stopped?5:1,1,'#1c1a22'); R(152,22,1,stopped?1:5,'#1c1a22');
  if(NIGHT){ R(145,15,14,14,'#fff3c8',false); R(152,16,1,7,'#1c1a22',false); R(152,22,1,5,'#1c1a22',false); }
}
function terminal(open){
  building(236,6,148,72,24,{roof:'#3f6f6a',roofLine:'#335c58',eave:'#22342f',wall:'#d3dad3',
    windows:[[12,14],[30,14],[104,14],[122,14],[140,14]],door:70,lit:open,boarded:!open});
  R(268,31,92,9,open?'#1f3b5a':'#4b5560'); txt(open?'RUANE FERRY CO.':'RUANE FE  Y C .',273,33,open?'#f3e6c4':'#b7b1a4');
  if(!open) for(const wx of [12,30,104,122,140]) boardUp(236+wx,6+24+14);
  if(open && NIGHT){ g.globalCompositeOperation='lighter'; for(const r of [10,6]){ g.fillStyle='rgba(255,190,90,0.10)'; g.beginPath(); g.arc(312,72,r,0,7); g.fill(); } g.globalCompositeOperation='source-over'; }
}
function houses(){
  building(0,0,64,64,26,{roof:'#a5503a',roofLine:'#8a3f2d',wall:'#e3d2b0',windows:[[8,10],[40,10]],door:26,lit:true});
  building(64,4,64,60,22,{roof:'#6f5a8a',roofLine:'#5b4973',wall:'#d9c7a6',windows:[[10,10],[44,10]],door:28,lit:true});
  building(176,2,56,62,24,{roof:'#a5503a',roofLine:'#8a3f2d',wall:'#e0cfae',windows:[[8,10],[38,10]],door:22,lit:true});
}
function pier(intact){
  if(intact){
    R(98,120,30,74,'#8a5a3a'); for(let y=122;y<194;y+=4) R(98,y,30,1,'#5c3a24'); R(98,120,1,74,'#b07a4e');
    for(const y of [140,170,192]){ R(96,y,3,10,'#3d2a1d'); R(127,y,3,10,'#3d2a1d'); }
    building(84,156,58,46,16,{roof:'#4f6b48',roofLine:'#41593b',wall:'#c8b48c',windows:[[8,8],[40,8]],door:23,lit:true});
    R(92,166,42,7,'#2b2a24'); txt('CHANDLERY',95,167,'#e8d6a8');
  } else {
    R(98,120,30,6,'#6d4a33'); R(98,125,30,1,'#3d2a1d'); // broken stub
    R(110,126,7,3,'#5c3a24'); // dangling plank
    for(const [x,y] of [[97,142],[127,148],[99,171],[126,176],[104,196],[121,200]]){ R(x,y,3,8,'#3d2a1d'); R(x-2,y+8,7,1,'#6fb0bd'); }
  }
}
function ferry(){
  R(250,124,134,10,'#7a5236'); for(let x=250;x<384;x+=8) R(x,124,1,10,'#5c3a24'); // dock
  R(246,148,124,30,'#1f2b44'); R(250,178,116,4,'#151d30'); R(246,148,124,4,'#a63a2e'); // hull
  R(262,134,86,14,'#efe9da'); for(let x=266;x<346;x+=10) win(x,137,true);
  R(312,124,10,12,'#e0b23a'); R(312,124,10,3,'#1c1a22'); // funnel
  txt('MARIGOLD',266,166,'#efe9da');
  R(300,132,6,2,'#8a8a8a'); // gangway
}
function fence(){ R(240,112,144,1,'#4b5057'); R(240,121,144,1,'#4b5057');
  for(let x=240;x<384;x+=2) R(x,113+(x%4?0:4),1,4,'#6c727a'); for(let x=240;x<384;x+=24) R(x,106,2,16,'#3a3e44'); }
function lanterns(){
  const strings=[[[20,62],[150,58]],[[160,58],[300,74]],[[40,64],[110,96]]];
  for(const [[x0,y0],[x1,y1]] of strings){
    for(let t=0;t<=1;t+=0.005){ const x=x0+(x1-x0)*t, y=y0+(y1-y0)*t+Math.sin(t*Math.PI)*12; R(x|0,y|0,1,1,'#2a2a2a',false); }
    for(let t=0.08;t<1;t+=0.12){ const x=(x0+(x1-x0)*t)|0, y=(y0+(y1-y0)*t+Math.sin(t*Math.PI)*12)|0;
      const lc = ['#ffcf6b','#ff8a5c','#ffd98a','#f26b5b'][(t*20|0)%4];
      g.globalCompositeOperation='lighter';
      for(const [r,a] of [[16,0.05],[10,0.07],[5,0.10]]){ g.fillStyle=`rgba(255,180,90,${a})`; g.beginPath(); g.arc(x+1,y+3,r,0,7); g.fill(); }
      g.globalCompositeOperation='source-over';
      R(x,y+1,3,4,lc,false); R(x+1,y,1,1,'#2a2a2a',false); R(x,y+5,3,1,'#7a3a20',false);
    }
  }
}
function plaque(){ R(124,86,12,10,'#6b5a3a'); R(125,87,10,8,'#b59a5a'); R(126,89,8,1,'#7a6438'); R(126,91,6,1,'#7a6438'); R(129,96,2,6,'#4a4036'); }
function bench(x,y){ R(x,y,26,3,'#8a5a3a'); R(x,y-6,26,2,'#6e4830'); R(x+2,y+3,2,5,'#3d2a1d'); R(x+22,y+3,2,5,'#3d2a1d'); }
function stall(x,y){ for(let i=0;i<34;i+=6) R(x+i,y,6,7,i%12?'#e8e0cc':'#4a7a8a'); R(x,y+7,34,2,'#2e4d58');
  R(x+2,y+9,2,18,'#5c3a24'); R(x+30,y+9,2,18,'#5c3a24'); R(x,y+20,34,8,'#7a5236'); R(x+4,y+22,8,4,'#8fa8b0'); R(x+16,y+22,10,4,'#6f8f74'); }
function noticeboard(x,y){ R(x,y,20,14,'#5c3a24'); R(x+1,y+1,18,12,'#a07850'); R(x+3,y+3,7,8,'#efe6cf'); R(x+11,y+2,6,6,'#e8d9a8'); }

// ---- compose ----
const MARA={hair:'#1f1a18',skin:'#7a4a2e',coat:'#d9772e',accent:'#f2d27a',pants:'#c0602a'};
const MARA_OLD={...MARA,hair:'#cfcac2'};
const DELL={hair:'#6a4a2a',skin:'#e0b08a',coat:'#5a3a4a',accent:'#d8c8a8',pants:'#2a2a30'};
const DELL_OLD={...DELL,hair:'#e8e4dc',coat:'#4a4250'};
const JUN={hair:'#2a2420',skin:'#c99a6e',coat:'#b0523a',accent:'#f0e0c0',pants:'#3a4a5a'};
const JUN_OLD={...JUN,hair:'#7d7770',coat:'#5f6e5a',accent:'#c8b88a'};

R(0,0,W,H,'#8b8579');
cobbles(0,60,W,62); water(130); quayEdge(120,0,98); quayEdge(120,128,W);
houses(); clockTower(!NIGHT); terminal(NIGHT); pier(NIGHT);
if(NIGHT){
  ferry(); lanterns();
  const crowd=[[200,98],[212,102],[224,96],[236,104],[188,104],[60,92],[72,98]];
  crowd.forEach(([x,y],i)=>person(x,y,{hair:['#2a2420','#6a4a2a','#a07040'][i%3],skin:['#e0b08a','#7a4a2e','#c99a6e'][i%3],
    coat:['#55594f','#5a4e4e','#4c5260','#5e5848'][i%4],accent:'#7a7a70',pants:'#2a2a30'},{kid:i===4}));
  person(286,104,DELL);                       // ticket booth
  person(258,110,MARA,{prop:'wrench'});       // by the slip
  person(106,136,JUN,{kid:true,prop:'broom'});// on the pier
  // night vignette
  const v=g.createRadialGradient(W/2,H/2,60,W/2,H/2,240); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(5,8,20,0.55)'); g.fillStyle=v; g.fillRect(0,0,W,H);
} else {
  fence(); plaque(); bench(150,104); noticeboard(214,78); stall(40,72);
  person(156,92,DELL_OLD,{old:true,prop:'cane'});
  person(52,96,JUN_OLD);
  for(const x of [16,70,140,190]){ R(x,112,5,7,'#3a3e44'); R(x,112,5,2,'#585e66'); }
  for(const [x,y] of [[30,66],[118,118],[230,116],[300,90],[352,100],[90,80]]){ R(x,y,1,3,'#5f7a4a'); R(x+2,y+1,1,2,'#6f8a55'); R(x+1,y+2,1,2,'#4f6a3d'); }
  R(310,96,22,5,'#6d7a82'); R(314,97,10,1,'#9fb0b8');
  // gulls
  for(const [x,y] of [[60,150],[200,170],[330,140]]){ R(x,y,2,1,'#f0f0f0',false); R(x+3,y,2,1,'#f0f0f0',false); R(x+2,y+1,1,1,'#f0f0f0',false); }
}

const c=document.getElementById('c').getContext('2d'); c.imageSmoothingEnabled=false; c.drawImage(lo,0,0,W*S,H*S);

const ui=document.getElementById('ui');
ui.innerHTML = NIGHT ? `
  <div class="chip">Lantern Night, 1984 &nbsp;·&nbsp; <b>8:15 PM</b> &nbsp;·&nbsp; horn at 9:00</div>
  <div class="label">style frame — not gameplay</div>
  <div class="box">
    <div class="prompt">tell Mara her coupling came in — it's in the stockroom</div>
    <div class="parse">You try to: TELL → Mara · "the spare coupling is in the stockroom" · 15 min</div>
    <div><span class="who">MARA:</span> In the stockroom? Dell swore it never came. ...Jun! Bring the keys.</div>
  </div>` : `
  <div class="chip">Gullhaven &nbsp;·&nbsp; <b>today</b></div>
  <div class="label">style frame — not gameplay</div>
  <div class="box">
    <div><span class="who">DELL:</span> Engine failure. The engine is the engineer's job. That's all the inquiry needed to know.</div>
    <div class="parse">[E] talk &nbsp; [T] intervene &nbsp; [J] journal</div>
  </div>`;
</script>
</body>
</html>
